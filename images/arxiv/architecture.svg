<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="ARXIV Agentic RAG"><title>ARXIV Agentic RAG</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3a9cc"/></marker></defs><rect width="1200" height="830" rx="18" fill="#0f1020"/><text x="40" y="48" font-size="22" font-weight="700" fill="#e8eaf6">ARXIV Agentic RAG</text><text x="40" y="72" font-size="13.5" fill="#a3a9cc">Hybrid retrieval, GraphRAG and an LLM router over arXiv papers, with a separate eval for each stage</text><rect x="40" y="96" width="1120" height="228" rx="14" fill="#161933" stroke="#2b3060"/><text x="60" y="124" font-size="11" fill="#6f76a3" font-weight="700" text-anchor="start">OFFLINE: BUILD THE INDEXES</text><rect x="64" y="138" width="180" height="86" rx="10" fill="#64748b" fill-opacity=".12" stroke="#64748b" stroke-width="1.5"/><rect x="64" y="148" width="4" height="66" rx="2" fill="#64748b"/><text x="82" y="164" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">arXiv API</text><text x="82" y="186" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">Paper metadata and</text><text x="82" y="204" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">abstracts by query</text><rect x="276" y="138" width="200" height="86" rx="10" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-width="1.5"/><rect x="276" y="148" width="4" height="66" rx="2" fill="#f59e0b"/><text x="294" y="164" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Semantic chunking</text><text x="294" y="186" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">MiniLM sentence vectors,</text><text x="294" y="204" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">split on topic shift</text><rect x="508" y="138" width="200" height="86" rx="10" fill="#3b82f6" fill-opacity=".12" stroke="#3b82f6" stroke-width="1.5"/><rect x="508" y="148" width="4" height="66" rx="2" fill="#3b82f6"/><text x="526" y="164" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Embed and index</text><text x="526" y="186" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">all-MiniLM-L6-v2</text><text x="526" y="204" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">normalized embeddings</text><rect x="740" y="138" width="396" height="86" rx="10" fill="#3b82f6" fill-opacity=".12" stroke="#3b82f6" stroke-width="1.5"/><rect x="740" y="148" width="4" height="66" rx="2" fill="#3b82f6"/><text x="758" y="164" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">OpenSearch</text><text x="758" y="186" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">One index serving BM25 text search</text><text x="758" y="204" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">and k-NN vector search</text><path d="M248,181 L270,181" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480,181 L502,181" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/><path d="M712,181 L734,181" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/><rect x="508" y="240" width="200" height="70" rx="10" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-width="1.5"/><rect x="508" y="250" width="4" height="50" rx="2" fill="#10b981"/><text x="526" y="266" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Entity extraction</text><text x="526" y="288" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">LLM pulls entities, relations</text><rect x="740" y="240" width="396" height="70" rx="10" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-width="1.5"/><rect x="740" y="250" width="4" height="50" rx="2" fill="#10b981"/><text x="758" y="266" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Knowledge graph</text><text x="758" y="288" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">NetworkX graph of methods, datasets, papers</text><path d="M376,226 L376,275 L502,275" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/><path d="M712,275 L734,275" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40" y="344" width="1120" height="286" rx="14" fill="#161933" stroke="#2b3060"/><text x="60" y="372" font-size="11" fill="#6f76a3" font-weight="700" text-anchor="start">ONLINE: ANSWER A QUESTION</text><rect x="64" y="440" width="150" height="90" rx="10" fill="#64748b" fill-opacity=".12" stroke="#64748b" stroke-width="1.5"/><rect x="64" y="450" width="4" height="70" rx="2" fill="#64748b"/><text x="82" y="466" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Question</text><text x="82" y="488" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">Free text query</text><text x="82" y="506" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">from the user</text><rect x="246" y="420" width="210" height="130" rx="10" fill="#ec4899" fill-opacity=".12" stroke="#ec4899" stroke-width="1.5"/><rect x="246" y="430" width="4" height="110" rx="2" fill="#ec4899"/><text x="264" y="446" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">LLM router</text><text x="264" y="468" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">Classifies the question:</text><text x="264" y="486" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">single fact or multi hop</text><text x="264" y="504" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">Logs its reasoning,</text><text x="264" y="522" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">falls back to vector</text><path d="M218,485 L240,485" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/><rect x="520" y="384" width="220" height="104" rx="10" fill="#3b82f6" fill-opacity=".12" stroke="#3b82f6" stroke-width="1.5"/><rect x="520" y="394" width="4" height="84" rx="2" fill="#3b82f6"/><text x="538" y="410" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Hybrid search</text><text x="538" y="432" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">BM25 top 20 + k-NN top 20</text><text x="538" y="450" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">fused with RRF (k = 60)</text><text x="538" y="468" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">Reads OpenSearch</text><rect x="772" y="384" width="170" height="104" rx="10" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-width="1.5"/><rect x="772" y="394" width="4" height="84" rx="2" fill="#8b5cf6"/><text x="790" y="410" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Cross encoder</text><text x="790" y="432" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">ms-marco-MiniLM</text><text x="790" y="450" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">15 candidates</text><text x="790" y="468" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">reranked to top 5</text><path d="M460,455 L488,455 L488,436 L514,436" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/><text x="466" y="428" font-size="11.5" fill="#3b82f6" font-weight="700" text-anchor="start">vector</text><path d="M744,436 L766,436" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/><rect x="520" y="512" width="422" height="92" rx="10" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-width="1.5"/><rect x="520" y="522" width="4" height="72" rx="2" fill="#10b981"/><text x="538" y="538" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Graph query</text><text x="538" y="560" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">Matches question entities to graph nodes</text><text x="538" y="578" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">and pulls their 1 to 2 hop neighborhood</text><path d="M460,515 L488,515 L488,558 L514,558" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/><text x="466" y="578" font-size="11.5" fill="#10b981" font-weight="700" text-anchor="start">graph</text><rect x="978" y="430" width="158" height="120" rx="10" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-width="1.5"/><rect x="978" y="440" width="4" height="100" rx="2" fill="#f59e0b"/><text x="996" y="456" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Generate</text><text x="996" y="478" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">LLM via LiteLLM</text><text x="996" y="496" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">Answer grounded</text><text x="996" y="514" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">in the evidence,</text><text x="996" y="532" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">plus route used</text><path d="M946,436 L960,436 L960,470 L972,470" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/><path d="M946,558 L960,558 L960,510 L972,510" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40" y="650" width="1120" height="154" rx="14" fill="#161933" stroke="#2b3060"/><text x="60" y="678" font-size="11" fill="#6f76a3" font-weight="700" text-anchor="start">EVALUATION HARNESS</text><rect x="64" y="692" width="250" height="82" rx="10" fill="#3b82f6" fill-opacity=".12" stroke="#3b82f6" stroke-width="1.5"/><rect x="64" y="702" width="4" height="62" rx="2" fill="#3b82f6"/><text x="82" y="718" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Retrieval</text><text x="82" y="740" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">recall@k against papers</text><text x="82" y="758" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">expected for each question</text><rect x="334" y="692" width="250" height="82" rx="10" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-width="1.5"/><rect x="334" y="702" width="4" height="62" rx="2" fill="#f59e0b"/><text x="352" y="718" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Answer quality</text><text x="352" y="740" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">LLM judge scores correctness</text><text x="352" y="758" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">and groundedness</text><rect x="604" y="692" width="250" height="82" rx="10" fill="#ec4899" fill-opacity=".12" stroke="#ec4899" stroke-width="1.5"/><rect x="604" y="702" width="4" height="62" rx="2" fill="#ec4899"/><text x="622" y="718" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Routing accuracy</text><text x="622" y="740" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">Router choice vs expected</text><text x="622" y="758" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">route, scored separately</text><rect x="906" y="692" width="230" height="82" rx="10" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-width="1.5"/><rect x="906" y="702" width="4" height="62" rx="2" fill="#8b5cf6"/><text x="924" y="718" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Weights and Biases</text><text x="924" y="740" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">Every eval run logged</text><text x="924" y="758" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">for comparison</text><path d="M189,776 L189,788 L1021,788" fill="none" stroke="#a3a9cc" stroke-width="1.8"/><path d="M459,776 L459,788 L1021,788" fill="none" stroke="#a3a9cc" stroke-width="1.8"/><path d="M729,776 L729,788 L1021,788" fill="none" stroke="#a3a9cc" stroke-width="1.8"/><path d="M1021,788 L1021,780" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/></svg>